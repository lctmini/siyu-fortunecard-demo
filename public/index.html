<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f0ff">
  <title>SiYu Cardie — กำลังปิดปรับปรุง</title>
  <style>
    :root {
      --purple: #9b83e8;
      --purple-dark: #6650ad;
      --blue: #8edcf4;
      --blue-dark: #4b9ebc;
      --cream: #fffdfb;
      --ink: #554b6e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      font-family: "Noto Sans Thai", "Tahoma", sans-serif;
      background:
        radial-gradient(circle at 12% 18%, #e7e0ff 0, transparent 27%),
        radial-gradient(circle at 88% 82%, #d9f6ff 0, transparent 29%),
        linear-gradient(145deg, #fbf8ff, #f2fbff);
      overflow: hidden;
    }
    .sparkle {
      position: fixed;
      user-select: none;
      pointer-events: none;
      opacity: .8;
      animation: float 4s ease-in-out infinite;
    }
    .s1 { top: 11%; left: 12%; font-size: 28px; }
    .s2 { top: 19%; right: 14%; font-size: 23px; animation-delay: -1s; }
    .s3 { bottom: 15%; left: 17%; font-size: 25px; animation-delay: -2s; }
    .s4 { bottom: 12%; right: 12%; font-size: 30px; animation-delay: -1.5s; }
    .card {
      position: relative;
      width: min(100%, 620px);
      padding: clamp(32px, 7vw, 64px) clamp(22px, 6vw, 54px);
      text-align: center;
      background: rgba(255, 253, 255, .88);
      border: 1px solid rgba(173, 153, 231, .35);
      border-radius: 32px;
      box-shadow: 0 24px 70px rgba(111, 91, 163, .13);
      backdrop-filter: blur(10px);
    }
    .flowers { font-size: clamp(27px, 5vw, 36px); letter-spacing: 8px; margin-bottom: 20px; }
    .brand {
      margin: 0 0 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 8vw, 54px);
      font-weight: 700;
      letter-spacing: .5px;
      background: linear-gradient(100deg, var(--purple-dark), #8e80d9 48%, var(--blue-dark));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .pill {
      display: inline-block;
      margin: 8px 0 24px;
      padding: 9px 17px;
      border-radius: 999px;
      color: #65549c;
      background: #eee8ff;
      border: 1px solid #ddd2ff;
      font-size: 14px;
      letter-spacing: .4px;
    }
    h1 {
      margin: 0 auto 16px;
      font-size: clamp(23px, 5vw, 32px);
      line-height: 1.55;
      font-weight: 700;
    }
    .message {
      margin: 0;
      font-size: clamp(16px, 3.8vw, 19px);
      line-height: 2;
      color: #756b88;
    }
    .message strong { color: #6b58b1; font-weight: 700; }
    .divider {
      width: 76px;
      height: 3px;
      margin: 27px auto;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--purple), var(--blue));
    }
    .hearts { margin-top: 25px; font-size: 24px; letter-spacing: 7px; }
    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #a49ab6;
      letter-spacing: 1.5px;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sparkle { animation: none; }
    }
  </style>
</head>
<body>
  <span class="sparkle s1" aria-hidden="true">⭐</span>
  <span class="sparkle s2" aria-hidden="true">💜</span>
  <span class="sparkle s3" aria-hidden="true">🌷</span>
  <span class="sparkle s4" aria-hidden="true">💙</span>

  <main class="card">
    <div class="flowers" aria-hidden="true">💜 🌷⭐ 💙</div>
    <p class="brand">SiYu Cardie</p>
    <div class="pill">✦ A LITTLE PAUSE ✦</div>
    <h1>ขออภัยนะคะ ♡<br>SiYu Cardie กำลังปิดปรับปรุง</h1>
	<h1>We’re sorry ♡<br>SiYu Cardie is currently under maintenance.</h1>
    <div class="divider"></div>
    <p class="message">
      <strong>น้องจะกลับมาในไม่ช้า</strong> ✨
    </p>
    <div class="hearts" aria-label="หัวใจสีม่วงและสีฟ้า">💜 💙 💙 💜</div>
    <div class="footer">SEE YOU AGAIN SOON</div>
  </main>
</body>
</html>
